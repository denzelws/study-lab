<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patterns</title>
    <script>
      (function () {
        var t = localStorage.getItem("patterns-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <style>
      :root,
      html[data-theme="light"] {
        --bg: #fcfcfc;
        --surface: #ffffff;
        --text: #1f2937;
        --heading: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --code-bg: #f9fafb;
        --code-text: #374151;
        --hover: #f3f4f6;
        --row-hover: #fafafa;
        --accent: #ffd21e;
        --link: #4b5563;
        --sidebar: #ffffff;
        --nav: #4b5563;
        --btn-border-hover: #d1d5db;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.04);
        --sidebar-w: 13.5rem;
        color-scheme: light;
      }

      html[data-theme="dark"] {
        --bg: #0b0f19;
        --surface: #111827;
        --text: #e5e7eb;
        --heading: #f3f4f6;
        --muted: #9ca3af;
        --border: #1f2937;
        --code-bg: #111827;
        --code-text: #d1d5db;
        --hover: #1f2937;
        --row-hover: #151c2c;
        --accent: #ffd21e;
        --link: #d1d5db;
        --sidebar: #0b0f19;
        --nav: #9ca3af;
        --btn-border-hover: #374151;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.35);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        display: flex;
        min-height: 100vh;
        align-items: stretch;
      }

      .sidebar {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: var(--sidebar);
        border-right: 1px solid var(--border);
        padding: 1.35rem 0.85rem 2rem;
        position: sticky;
        top: 0;
        align-self: flex-start;
        height: 100vh;
        overflow-y: auto;
      }

      .sidebar-brand {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 0.55rem 0.85rem;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      .nav-item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 0.45rem;
        padding: 0.38rem 0.55rem;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--nav);
        cursor: pointer;
        text-decoration: none;
      }

      .nav-item:hover {
        background: var(--hover);
        color: var(--heading);
      }

      .nav-item[aria-current="page"] {
        background: var(--code-bg);
        color: var(--heading);
        font-weight: 600;
      }

      .nav-item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .nav-empty {
        color: var(--muted);
        font-size: 0.8rem;
        padding: 0.4rem 0.55rem;
      }

      .main {
        flex: 1;
        min-width: 0;
        padding: 1.75rem 1.75rem 4.5rem 1.15rem;
      }

      .article-wrap {
        max-width: 48rem;
        margin: 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        padding-bottom: 1.15rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: baseline;
        gap: 0.6rem;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .brand span {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 400;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .upload {
        display: inline-flex;
        align-items: center;
        padding: 0.42rem 0.85rem;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        box-shadow: var(--shadow);
      }

      .upload:hover {
        background: var(--hover);
        border-color: var(--btn-border-hover);
      }

      .upload:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .file-name {
        color: var(--muted);
        font-size: 0.8rem;
        margin: -0.5rem 0 1.35rem;
      }

      .empty {
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
        padding: 4rem 1rem;
        border: 1px dashed var(--border);
        border-radius: 0.75rem;
        background: var(--surface);
      }

      .prose :first-child {
        margin-top: 0;
      }

      .prose h1,
      .prose h2,
      .prose h3,
      .prose h4 {
        color: var(--heading);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.35;
      }

      .prose h1 {
        font-size: 1.5rem;
        margin: 0 0 0.85rem;
      }

      .prose h2 {
        font-size: 1.15rem;
        margin: 2rem 0 0.65rem;
      }

      .prose h3 {
        font-size: 1.02rem;
        margin: 1.6rem 0 0.5rem;
      }

      .prose p {
        margin: 0.7rem 0;
      }

      .prose strong {
        font-weight: 600;
        color: var(--heading);
      }

      .prose p:has(> strong:only-child) {
        font-size: 1.08rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 1.85rem 0 0.45rem;
        color: var(--heading);
      }

      .prose p:has(> strong:first-child) {
        margin-top: 1.1rem;
      }

      .prose p:has(> strong:only-child) + p {
        margin-top: 0.35rem;
      }

      .prose a {
        color: var(--link);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }

      .prose a:hover {
        color: var(--heading);
        border-bottom-color: var(--btn-border-hover);
      }

      .prose ul,
      .prose ol {
        margin: 0.6rem 0 0.9rem;
        padding-left: 1.2rem;
      }

      .prose li {
        margin: 0.28rem 0;
      }

      .prose hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 1.75rem 0;
      }

      .prose blockquote {
        margin: 1rem 0;
        padding: 0.15rem 0 0.15rem 1rem;
        border-left: 3px solid var(--border);
        color: var(--muted);
      }

      .prose blockquote p {
        margin: 0.35rem 0;
      }

      .prose code {
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-variant-ligatures: none;
        font-size: 0.86em;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 0.35rem;
        padding: 0.12em 0.35em;
      }

      .prose pre {
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-variant-ligatures: none;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.95rem 1.05rem;
        overflow-x: auto;
        margin: 1rem 0 1.25rem;
      }

      .prose pre code {
        background: none;
        border: 0;
        padding: 0;
        font-size: 0.84rem;
        line-height: 1.6;
        color: var(--code-text);
      }

      .prose table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
        margin: 1rem 0 1.4rem;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
      }

      .prose thead {
        background: var(--code-bg);
      }

      .prose th,
      .prose td {
        text-align: left;
        padding: 0.6rem 0.8rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      .prose th {
        font-weight: 600;
        color: var(--heading);
        font-size: 0.82rem;
      }

      .prose tbody tr:last-child td {
        border-bottom: 0;
      }

      .prose tbody tr:hover {
        background: var(--row-hover);
      }

      @media (max-width: 800px) {
        .shell {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          height: auto;
          position: relative;
          border-right: 0;
          border-bottom: 1px solid var(--border);
          padding: 1rem 1.1rem;
        }

        .nav {
          flex-direction: row;
          flex-wrap: wrap;
        }

        .main {
          padding: 1.35rem 1.1rem 3rem;
        }

        .prose table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-brand">Tópicos</div>
        <nav id="nav" class="nav" aria-label="Padrões"></nav>
      </aside>
      <div class="main">
        <div class="article-wrap">
          <header>
            <div class="brand">
              <h1>Patterns</h1>
              <span>Leitor de markdown</span>
            </div>
            <div class="header-actions">
              <button type="button" class="upload" id="theme-btn" aria-label="Alternar tema">
                Claro
              </button>
              <button type="button" class="upload" id="upload-btn">
                Upload .md
              </button>
            </div>
            <input id="file" type="file" accept=".md,text/markdown" hidden />
          </header>
          <p id="file-name" class="file-name" hidden></p>
          <div id="empty" class="empty">
            Sirva esta pasta com HTTP e clique num tópico. Upload é o plano B.
          </div>
          <article id="content" class="prose" hidden></article>
        </div>
      </div>
    </div>
    <script>
      marked.setOptions({ gfm: true, breaks: false });

      const fileInput = document.getElementById("file");
      const empty = document.getElementById("empty");
      const content = document.getElementById("content");
      const fileName = document.getElementById("file-name");
      const uploadBtn = document.getElementById("upload-btn");
      const themeBtn = document.getElementById("theme-btn");
      const nav = document.getElementById("nav");

      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      }

      function syncThemeButton() {
        const dark = currentTheme() === "dark";
        themeBtn.textContent = dark ? "Claro" : "Escuro";
        themeBtn.setAttribute("aria-label", dark ? "Mudar para tema claro" : "Mudar para tema escuro");
      }

      function setTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("patterns-theme", theme);
        syncThemeButton();
      }

      let topics = [];

      function slugFromHash() {
        return decodeURIComponent(location.hash.replace(/^#/, "")).trim();
      }

      function renderMarkdown(markdown, name) {
        const html = DOMPurify.sanitize(marked.parse(markdown));
        content.innerHTML = html;
        content.hidden = false;
        empty.hidden = true;
        if (name) {
          fileName.hidden = false;
          fileName.textContent = name;
        }
      }

      function setActive(slug) {
        for (const btn of nav.querySelectorAll(".nav-item")) {
          const on = btn.dataset.slug === slug;
          btn.setAttribute("aria-current", on ? "page" : "false");
        }
      }

      function renderNav() {
        nav.innerHTML = "";
        if (!topics.length) {
          nav.innerHTML = '<p class="nav-empty">Nenhum tópico no índice.</p>';
          return;
        }
        for (const slug of topics) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "nav-item";
          btn.dataset.slug = slug;
          btn.textContent = slug;
          btn.addEventListener("click", () => {
            if (location.hash !== "#" + slug) {
              location.hash = slug;
            } else {
              loadTopic(slug);
            }
          });
          nav.appendChild(btn);
        }
      }

      async function loadTopic(slug) {
        if (!slug) return;
        const file = slug + ".md";
        const res = await fetch(file);
        if (!res.ok) {
          empty.hidden = false;
          content.hidden = true;
          fileName.hidden = false;
          fileName.textContent = "Não achei " + file;
          setActive("");
          return;
        }
        renderMarkdown(await res.text(), file);
        setActive(slug);
        document.title = slug + " · Patterns";
      }

      async function boot() {
        try {
          const res = await fetch("index.json");
          const data = await res.json();
          topics = Array.isArray(data.topics) ? data.topics : [];
        } catch {
          topics = [];
        }
        renderNav();
        const fromHash = slugFromHash();
        const first = topics.includes(fromHash) ? fromHash : topics[0];
        if (first) {
          if (!fromHash) location.hash = first;
          else await loadTopic(first);
        }
      }

      window.renderMarkdown = renderMarkdown;
      window.addEventListener("hashchange", () => loadTopic(slugFromHash()));
      syncThemeButton();
      themeBtn.addEventListener("click", () => {
        setTheme(currentTheme() === "dark" ? "light" : "dark");
      });
      uploadBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        renderMarkdown(await file.text(), file.name);
        setActive("");
      });

      boot();
    </script>
  </body>
</html>
